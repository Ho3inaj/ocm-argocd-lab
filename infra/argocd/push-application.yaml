apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-push-spoke1
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: __GIT_REPO_URL__
    targetRevision: __GIT_REPO_BRANCH__
    path: apps/overlays/spoke1
  destination:
    server: __SPOKE1_SERVER__
    namespace: podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
